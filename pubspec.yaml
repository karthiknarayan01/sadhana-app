name: sadhana
description: "Meditation, pranayama, and Sanskrit prayer search"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management — see lib/core for the drift database this wires
  # StreamProviders up to.
  flutter_riverpod: ^2.6.1

  # Local persistence: drift (sqlite) for per-session practice history
  # (needed for streaks/charts, not just a running total), shared_preferences
  # for simple scalar settings (mute, last-used duration).
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3

  # Meditation/breathing: bell/gong playback, audio session category, and
  # keeping the screen awake during an active practice.
  just_audio: ^0.9.42
  audio_session: ^0.1.25
  wakelock_plus: ^1.2.10

  # Breathing pacer + progress-screen polish (glow/fade/stagger).
  flutter_animate: ^4.5.2

  # timer_controller.dart reads the wall clock through clock.now() instead
  # of DateTime.now() directly, specifically so tests can virtualize it
  # (see fake_async below) instead of waiting on real seconds.
  clock: ^1.1.2

  # Progress screen: weekly/monthly practice-minutes chart, and a small
  # celebratory burst the first time a milestone unlocks.
  fl_chart: ^0.69.2
  confetti: ^0.8.0

  # Shloka search: HTTP client for the backend's /search endpoint, a loading
  # skeleton, and plain-text sharing. Devanagari/serif reading type is
  # bundled locally (see flutter.fonts below), not google_fonts' default
  # runtime CDN fetch — the reader is the app's main content, so its font
  # can't wait on a network round-trip on first view.
  dio: ^5.7.0
  shimmer: ^3.0.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # drift's generated .g.dart files (table/query code) come from this.
  build_runner: ^2.4.15
  drift_dev: ^2.24.0

  # Lets timer/breathing tests fast-forward Timer + clock.now() together
  # deterministically, instead of real-time waits.
  fake_async: ^1.3.3

  # Generates every iOS/Android launcher icon size from the one master in
  # assets/icon/ — run via `dart run flutter_launcher_icons`, not automatic
  # on every build, since the master only changes rarely.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/content/
    - assets/icon/

  # Bundled locally rather than fetched from Google's CDN at runtime (the
  # google_fonts package's default) — the shloka reader is the app's core
  # content, so its font must be available instantly, not after a network
  # round-trip flashes the fallback font first. See ATTRIBUTION.md.
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic
    # Flutter web fetches Roboto from Google's CDN by default when it isn't
    # bundled (it's Material's default typeface, used app-wide) — the same
    # first-paint network dependency as the two above, just app-wide rather
    # than reader-only. Weights 400/500/700 cover Material 3's typography
    # scale (regular body text, M3's medium-weight titles/labels, and
    # anything explicitly set to FontWeight.bold).
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  # The App Store icon must have no alpha channel — this master is fully
  # opaque already, but iOS export otherwise still tags one, which Apple
  # rejects at submission.
  remove_alpha_ios: true
